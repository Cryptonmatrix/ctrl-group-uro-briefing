<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URO Advisor Pro — Briefing</title>
<style>
:root{
  /* Aus den Original-Screenshots gepipettet, nicht geschaetzt */
  --uro-blue:#5499e4; --uro-red:#e7493a; --uro-cyan:#64c2ea;
  --uro-orange:#ff6b00; --page:#e9e9e9; --strip:#f7f8fa;
  --ink:#2a292f; --muted:#7a7a83; --line:#dcdcdc;
  --amber:#e8a33d; --green:#3f9e6b; --violet:#8b6bd9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}

/* ---------- Kopfleisten, exakt wie im Original: blau / weiss / grau ---------- */
.topbar{background:var(--uro-blue);height:34px;display:flex;align-items:center;
  padding:0 14px;gap:14px;color:#fff}
.topbar img{height:15px}
.topbar .spacer{flex:1}
.topbar .search{background:rgba(255,255,255,.18);border:0;border-radius:2px;color:#fff;
  padding:3px 9px;width:230px;font-size:12px}
.topbar .search::placeholder{color:rgba(255,255,255,.75)}
.topbar .user{font-size:12px;opacity:.95}

.clientbar{background:#fff;border-bottom:1px solid var(--line);height:38px;
  display:flex;align-items:center;padding:0 14px;gap:10px}
.clientbar .name{font-size:14px}
.clientbar .spacer{flex:1}
.actions{display:flex;align-items:center;gap:2px}
.action{background:none;border:0;color:#5a5a63;padding:5px 9px;font-size:12px;border-radius:2px}
.action:hover{background:#f0f0f3}
.action.primary{background:var(--uro-orange);color:#fff;font-weight:600;padding:6px 14px}
.action.primary:hover{background:#e66000}
.action.primary:disabled{background:#c9c9cf;cursor:default}

.metabar{background:var(--strip);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:8px 14px;gap:26px}
.metabar .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.metabar .v{font-size:13px}
.metabar .spacer{flex:1}
.metabar .total{font-size:18px}

/* ---------- Rumpf ---------- */
.body{display:flex;align-items:flex-start;gap:12px;padding:12px}
.sidebar{width:240px;background:#fff;border:1px solid var(--line);flex:none;
  max-height:calc(100vh - 110px);overflow:auto}
.sidebar h3{margin:0;padding:9px 11px;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.cli{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid #f0f0f0;padding:7px 11px}
.cli:hover{background:#f6f9fd}
.cli.on{background:#eaf3fc;box-shadow:inset 3px 0 0 var(--uro-blue)}
.cli .r{font-size:10px;color:var(--muted)}
.cli .n{font-size:12.5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--line)}
.card h2{margin:0;padding:9px 13px;font-size:12px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.card .in{padding:13px}

/* ---------- Kennzahl-Kacheln, wie das Raster rechts im Original ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);padding:10px 12px;min-height:74px}
.tile .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.tile .v{font-size:21px;margin-top:5px}
.tile .s{font-size:11px;color:var(--muted)}
.tile.alarm{background:var(--uro-red);border-color:var(--uro-red);color:#fff}
.tile.alarm .k,.tile.alarm .s{color:rgba(255,255,255,.9)}

/* ---------- Findings ---------- */
.finding{border-left:3px solid var(--line);padding:9px 12px;border-bottom:1px solid #f2f2f2}
.finding:last-child{border-bottom:0}
.finding.error{border-left-color:var(--uro-red);background:#fdf5f4}
.finding.warning{border-left-color:var(--amber)}
.finding.info{border-left-color:var(--uro-cyan)}
.finding .t{display:flex;gap:8px;align-items:baseline}
.finding .ttl{flex:1;font-size:13px}
.finding .d{color:var(--muted);font-size:12px;margin-top:2px}
.score{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted)}
.badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;
  border-radius:2px;background:#eceef1;color:#5a5a63;white-space:nowrap}
.badge.error{background:var(--uro-red);color:#fff}
.badge.warning{background:var(--amber);color:#fff}

/* ---------- Ladeanimation: zeigt die vier Datenquellen ---------- */
.loader{display:none;padding:15px 13px}
.loader.on{display:block}
.srcs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.src{font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:12px;
  color:var(--muted);background:#fafafa;transition:all .25s}
.src.done{border-color:var(--green);color:var(--green);background:#f2fbf6}
.src.none{opacity:.45;border-style:dashed}
.src.none::before{content:"– "}
.wc{font-variant-numeric:tabular-nums}
.wc.over{color:var(--uro-red);font-weight:600}
.src.done::before{content:"✓ "}
.phase{font-size:11.5px;color:var(--muted);margin-top:9px;font-variant-numeric:tabular-nums}
.bar{height:2px;background:#eee;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--uro-blue);
  animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}

/* ---------- Briefing ---------- */
.headline{font-size:15px;line-height:1.45;padding:13px;border-bottom:1px solid var(--line);background:#fafbfd}
.sec{padding:11px 13px;border-bottom:1px solid #f2f2f2}
.sec h4{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.st{display:flex;gap:8px;padding:3px 0}
.st .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.st .tx{flex:1}
.st .src{font-size:10px;border:0;background:none;padding:0;color:#aaa}
.t-fact .dot{background:#9aa0a6} .t-market .dot{background:var(--uro-cyan)}
.t-house_view .dot{background:var(--violet)} .t-recommendation .dot{background:var(--green)}
.t-risk .dot{background:var(--uro-red)}
.notice{padding:13px;color:var(--muted);font-size:12.5px;background:#fffdf5;
  border-left:3px solid var(--amber)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* Kursverlauf. Eine Serie, also keine Legende — die Ueberschrift benennt sie. */
.chartcard{position:relative}
.chartwrap{position:relative;padding:6px 66px 22px 13px}
.chartwrap svg{display:block;width:100%;height:110px;overflow:visible}
.chartwrap .axis{stroke:var(--line);stroke-width:1}
.chartwrap .line{fill:none;stroke:var(--uro-blue);stroke-width:2;
  stroke-linejoin:round;stroke-linecap:round}
.chartwrap .area{opacity:.13}
.chartwrap .area.up{fill:var(--green)}
.chartwrap .area.down{fill:var(--uro-red)}
.chartwrap .grid{stroke:var(--line);stroke-width:1;opacity:.7}
.chartwrap .baseline{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.8}
.chartwrap .lbl.base{fill:var(--muted);font-weight:600}
.chg{font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;margin-left:auto}
.chg.up{color:var(--green)} .chg.down{color:var(--uro-red)}
.chartwrap .endpt{fill:var(--uro-blue);stroke:#fff;stroke-width:2}
.chartwrap .lbl{font-size:10px;fill:var(--muted)}
.ylbl{position:absolute;right:8px;transform:translateY(-50%);font-size:10px;
  color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none;
  background:#fff;padding:0 2px}
.ylbl.base{font-weight:600}
.xlbl{position:absolute;bottom:2px;transform:translateX(-50%);font-size:10px;
  color:var(--muted);pointer-events:none}
.chartwrap .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2;opacity:0}
.chartwrap .hit{fill:transparent;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);
  padding:4px 8px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .08s;
  box-shadow:0 1px 4px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}

/* Herkunft des Briefings */
.modebadge{font-size:10px;text-transform:uppercase;letter-spacing:.4px;
  padding:2px 8px;border-radius:2px;margin-left:auto;font-weight:600}
.m-ai{background:#eef6ee;color:var(--green)}
.m-ai_retry,.m-ai_gemini{background:#fdf6e8;color:#9a6b12}
.m-fallback{background:var(--uro-red);color:#fff}
.card h2.withbadge{display:flex;align-items:center;gap:8px}
.newtag{font-size:9px;background:var(--uro-orange);color:#fff;padding:1px 5px;
  border-radius:2px;margin-left:5px;letter-spacing:.3px}
.legend{display:flex;gap:13px;flex-wrap:wrap;padding:8px 13px;font-size:11px;
  color:var(--muted);border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%;display:block}
</style>
</head>
<body>

<div class="topbar">
  <img src="/assets/logos/uro-dark.svg" alt="UNRISKOMEGA">
  <span class="spacer"></span>
  <input class="search" placeholder="Suche">
  <span class="user">Hans Muster</span>
</div>

<div class="clientbar">
  <span class="name" id="cname">Kein Klient gewählt</span>
  <span class="spacer"></span>
  <div class="actions">
    <button class="action" id="uploadbtn">Klientendatei laden</button>
    <input type="file" id="uploadinput" accept=".json,application/json" hidden>
    <button class="action">Telefonberatung</button>
    <button class="action">Beratermappe</button>
    <button class="action">Notizen</button>
    <button class="action">Analyse</button>
    <button class="action">Kundeninformation</button>
    <button class="action" id="report" disabled title="Erst ein Briefing erzeugen">Protokoll</button>
    <button class="action primary" id="gen" disabled>Generate Briefing</button>
  </div>
</div>

<div class="metabar">
  <div><div class="k">Kundentyp</div><div class="v" id="mtype">—</div></div>
  <div><div class="k">Risikoprofil</div><div class="v" id="mprof">—</div></div>
  <div><div class="k">Letzter Kontakt</div><div class="v" id="mcontact">—</div></div>
  <span class="spacer"></span>
  <div class="total" id="mtotal">—</div>
</div>

<div class="body">
  <div class="sidebar">
    <h3>Meine Kunden</h3>
    <div id="clist"></div>
  </div>

  <div class="main" id="main">
    <div class="card"><div class="empty">Wähle links einen Klienten.</div></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const chf = n => new Intl.NumberFormat('de-CH',{maximumFractionDigits:0}).format(n||0);
// Die Engine liefert volle Genauigkeit. Angezeigt werden zwei Nachkommastellen —
// "+6.092343%" liest sich wie ein Rohdatensatz, nicht wie ein Beraterwerkzeug.
const pct = (n, sign=true) => n==null ? '—'
  : (sign && n>0 ? '+' : '') + n.toFixed(2) + '%';
const esc = s => String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let current = null, facts = null;

async function boot(){
  const cs = await (await fetch('/api/clients')).json();
  $('#clist').innerHTML = cs.map(c=>
    `<button class="cli" data-ref="${c.ref}">
       <div class="r">${c.ref}${c.is_company?' · Firma':''}${c.is_new?'<span class="newtag">NEU</span>':''}</div>
       <div class="n">${esc(c.name)}</div>
       <div class="r">CHF ${chf(c.aum)}</div>
     </button>`).join('');
  $('#clist').onclick = e => { const b = e.target.closest('.cli'); if(b) select(b.dataset.ref); };
}

async function select(ref){
  current = ref;
  document.querySelectorAll('.cli').forEach(b=>b.classList.toggle('on', b.dataset.ref===ref));
  const d = await (await fetch(`/api/clients/${ref}/facts`)).json();
  facts = d;
  const fs = d.fact_sheet;
  $('#cname').textContent = `${d.display_name} (${fs.client_ref})`;
  $('#mtype').textContent = fs.is_company ? 'Juristische Person' : 'Natürliche Person';
  $('#mprof').textContent = fs.risk_profile_name || 'nicht hinterlegt';
  $('#mcontact').textContent = fs.last_contact ? fs.last_contact.slice(0,10) : '—';
  $('#mtotal').textContent = `${fs.reporting_currency} ${chf(fs.total_aum_chf)}`;
  $('#gen').disabled = false;
  $('#report').disabled = true;
  $('#report').title = 'Erst ein Briefing erzeugen';
  renderFacts(d);
}

// Kursverlauf des Portfolios. Eine Serie, 2px-Linie, zurueckhaltende Achse,
// Hover-Ebene mit Fadenkreuz — nur Anfang, Tief, Hoch und Ende beschriftet,
// keine Zahl an jedem Punkt.
const CHART_W = 600, CHART_H = 110, PAD_T = 12, PAD_B = 10, PAD_R = 0;
let chartPts = [];

function chartCard(p){
  const h = (p.history||[]).filter(x=>x && x.value!=null);
  if(h.length < 3) return '';
  const vals = h.map(x=>x.value);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  // Startwert muss in die Skala passen, sonst liegt die Referenzlinie ausserhalb.
  const base = h[0].value;
  const yLo = Math.min(lo, base), yHi = Math.max(hi, base);
  const span = (yHi - yLo) || 1;
  const plotW = CHART_W, plotH = CHART_H - PAD_T - PAD_B;
  const x = i => i * (plotW/(h.length-1));
  const y = v => PAD_T + plotH * (1 - (v-yLo)/span);
  chartPts = h.map((d,i)=>({x:x(i), y:y(d.value), date:d.date, value:d.value}));

  const line = chartPts.map((pt,i)=>`${i?'L':'M'}${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join('');
  const yBase = y(base);
  // Flaeche zwischen Kurs und Startwert: sichtbar machen, wann das Depot
  // ueber und wann unter dem Ausgangswert lag.
  const area = `${line}L${plotW},${yBase}L0,${yBase}Z`;

  const last = h[h.length-1];
  const change = ((last.value/base)-1)*100;
  const up = change >= 0;

  // Werteachse: drei Marken reichen. Mehr Linien lenken von der Kurve ab.
  // Marken, die zu nah an der Startlinie liegen, fallen weg — sonst ueberlappen
  // die Beschriftungen. Der Startwert ist wichtiger als eine runde Zahl daneben.
  const tickVals = [yHi, (yHi+yLo)/2, yLo].filter(v => Math.abs(y(v)-y(base)) > 11);
  const ticks = tickVals.map(v => `
    <line class="grid" x1="0" y1="${y(v).toFixed(1)}" x2="${plotW}" y2="${y(v).toFixed(1)}"
          vector-effect="non-scaling-stroke"/>`).join('');
  // Beschriftungen als HTML ueber dem SVG: im SVG wuerden sie mitgestreckt.
  const yLabels = tickVals.map(v => `
    <span class="ylbl" style="top:${(y(v)/CHART_H*100).toFixed(2)}%">${chf(v)}</span>`).join('')
    + `<span class="ylbl base" style="top:${(yBase/CHART_H*100).toFixed(2)}%">Start</span>`;

  // Zeitachse: nur Jahreswechsel, sonst ueberlappen die Beschriftungen.
  const years = [];
  h.forEach((d,i)=>{
    const yr = (d.date||'').slice(0,4);
    if(yr && !years.some(v=>v.yr===yr)) years.push({yr, i});
  });
  const xLabels = years.map(v => `
    <span class="xlbl" style="left:${(x(v.i)/CHART_W*100).toFixed(2)}%">${v.yr}</span>`).join('');

  return `
    <div class="card chartcard">
      <h2 class="withbadge">Kursverlauf
        <span class="chg ${up?'up':'down'}">${up?'+':''}${change.toFixed(1)}% seit ${(h[0].date||'').slice(0,7)}</span>
      </h2>
      <div class="chartwrap" id="chartwrap">
        <svg viewBox="0 0 ${CHART_W} ${CHART_H}" preserveAspectRatio="none">
          ${ticks}
          <path class="area ${up?'up':'down'}" d="${area}"/>
          <line class="baseline" x1="0" y1="${yBase.toFixed(1)}" x2="${plotW}" y2="${yBase.toFixed(1)}"
                vector-effect="non-scaling-stroke"/>
          <path class="line" d="${line}" vector-effect="non-scaling-stroke"/>
          <line class="cross" id="cross" y1="${PAD_T}" y2="${CHART_H-PAD_B}" vector-effect="non-scaling-stroke"/>
          <circle class="endpt" id="marker" r="4" cx="${chartPts.at(-1).x.toFixed(1)}"
                  cy="${chartPts.at(-1).y.toFixed(1)}" vector-effect="non-scaling-stroke"/>
          <rect class="hit" id="hit" x="0" y="0" width="${plotW}" height="${CHART_H}"/>
        </svg>
        ${yLabels}
        ${xLabels}
        <div class="tip" id="tip"></div>
      </div>
      <div class="legend">
        <span>Tief <b>${chf(lo)}</b> (${(h[vals.indexOf(lo)].date||'').slice(0,7)})</span>
        <span>Hoch <b>${chf(hi)}</b> (${(h[vals.indexOf(hi)].date||'').slice(0,7)})</span>
        <span style="margin-left:auto">Stand ${(last.date||'').slice(0,7)} · <b>CHF ${chf(last.value)}</b></span>
      </div>
    </div>`;
}

function wireChart(){
  const wrap = $('#chartwrap'); if(!wrap || !chartPts.length) return;
  const hit = $('#hit'), cross = $('#cross'), marker = $('#marker'), tip = $('#tip');
  const show = e => {
    const r = wrap.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, ((e.clientX - r.left)/r.width) * (CHART_W/(CHART_W-PAD_R))));
    const pt = chartPts[Math.round(frac*(chartPts.length-1))];
    cross.setAttribute('x1', pt.x); cross.setAttribute('x2', pt.x);
    cross.style.opacity = 1;
    marker.setAttribute('cx', pt.x); marker.setAttribute('cy', pt.y);
    tip.textContent = `${pt.date?.slice(0,7)||''} · CHF ${chf(pt.value)}`;
    tip.style.opacity = 1;
    const px = (pt.x/CHART_W)*r.width;
    tip.style.left = Math.min(Math.max(px-40, 0), r.width-120)+'px';
    tip.style.top = ((pt.y/CHART_H)*r.height - 30)+'px';
  };
  hit.addEventListener('mousemove', show);
  hit.addEventListener('mouseleave', ()=>{
    cross.style.opacity = 0; tip.style.opacity = 0;
    const last = chartPts.at(-1);
    marker.setAttribute('cx', last.x); marker.setAttribute('cy', last.y);
  });
}

const MODE_TEXT = {
  ai: 'KI-Briefing', ai_retry: 'KI · zweiter Versuch',
  ai_gemini: 'KI · Ersatzmodell',
  fallback: 'Regelbasiert — Sprachmodell nicht verfügbar',
};

function renderFacts(d){
  const fs = d.fact_sheet, p = fs.portfolios[0] || {};
  const errs = fs.findings.filter(f=>f.severity==='error').length;
  const vola = p.volatility!=null ? (p.volatility*100).toFixed(1)+'%' : '—';
  const maxv = fs.max_volatility!=null ? (fs.max_volatility*100).toFixed(1)+'%' : '—';
  const breach = p.volatility!=null && fs.max_volatility!=null && p.volatility>fs.max_volatility;

  $('#main').innerHTML = `
    <div class="tiles">
      <div class="tile ${breach?'alarm':''}">
        <div class="k">Volatilität</div><div class="v">${vola}</div>
        <div class="s">Profillimit ${maxv}</div></div>
      <div class="tile ${errs?'alarm':''}">
        <div class="k">Befunde</div><div class="v">${errs}</div>
        <div class="s">von ${fs.findings.length} gesamt</div></div>
      <div class="tile"><div class="k">Rendite 3M</div>
        <div class="v">${pct(p.perf_3m_pct)}</div>
        <div class="s">YTD ${pct(p.perf_ytd_pct, false)}</div></div>
      <div class="tile"><div class="k">Liquidität</div>
        <div class="v">${chf(fs.total_liquidity_chf)}</div>
        <div class="s">${(100*fs.total_liquidity_chf/(fs.total_aum_chf||1)).toFixed(1)}% des Vermögens</div></div>
      <div class="tile"><div class="k">Offene Vorschläge</div>
        <div class="v">${fs.open_proposals}</div><div class="s">&nbsp;</div></div>
    </div>

    ${chartCard(p)}

    <div class="card" id="bcard">
      <h2 class="withbadge">60-Sekunden-Briefing<span id="modebadge"></span></h2>
      <div class="loader" id="loader">
        <div class="srcs">
          <span class="src" data-s="0">Portfolio &amp; Positionen</span>
          <span class="src" data-s="1">CRM-Kontext</span>
          <span class="src" data-s="2">Marktnews</span>
          <span class="src" data-s="3">House View</span>
        </div>
        <div class="bar"><i></i></div>
        <div class="phase" id="phase">Befunde werden zusammengestellt …</div>
      </div>
      <div id="bout"><div class="empty">„Generate Briefing" oben rechts.</div></div>
    </div>

    <div class="card">
      <h2>Befunde der Engine · ${d.engine_ms} ms</h2>
      ${fs.findings.slice(0,8).map(f=>`
        <div class="finding ${f.severity}">
          <div class="t">
            <span class="badge ${f.severity}">${f.severity}</span>
            <span class="ttl">${esc(f.title)}</span>
            <span class="score">${f.score.toFixed(2)}</span>
          </div>
          <div class="d">${esc(f.detail)}</div>
        </div>`).join('')}
    </div>`;
  wireChart();
}

$('#gen').onclick = async () => {
  if(!current) return;
  $('#gen').disabled = true;
  $('#loader').classList.add('on');
  $('#bout').innerHTML = '';
  const srcs = document.querySelectorAll('.src');
  // Keine Zeitschaltung mehr. Die Chips leuchten erst, wenn die Quelle
  // nachweislich etwas beigetragen hat — sichtbar an den Finding-IDs, die
  // das fertige Briefing zitiert.
  srcs.forEach(s=>s.classList.remove('done','none'));

  // Ohne laufende Anzeige wirken 20 Sekunden wie ein Absturz.
  const t0 = Date.now();
  const phase = $('#phase');
  const tick = setInterval(()=>{
    const s = ((Date.now()-t0)/1000).toFixed(1);
    phase.textContent = s < 1.5
      ? `Befunde werden zusammengestellt … ${s}s`
      : `Claude formuliert das Briefing … ${s}s`;
  }, 100);

  let res, data;
  try{
    res = await fetch(`/api/clients/${current}/briefing`, {method:'POST'});
    data = await res.json();
  }catch(e){ data = {detail:'Server nicht erreichbar: '+e.message}; res = {ok:false}; }

  clearInterval(tick);
  $('#loader').classList.remove('on');
  srcs.forEach(s=>s.classList.remove('done'));
  $('#gen').disabled = false;

  if(!res.ok){
    $('#bout').innerHTML = `<div class="notice"><b>Briefing-Text nicht verfügbar.</b><br>
      ${esc(data.detail||'Unbekannter Fehler')}<br><br>
      Die Engine hat trotzdem gerechnet — die Befunde unten stammen aus echten Daten.</div>`;
    return;
  }
  renderBriefing(data);
};

// Welche Finding-Praefixe zu welcher Datenquelle gehoeren. Steht so auch im
// Backend (uro/models.py, Finding-ID-Schema).
const SOURCE_PREFIXES = {
  0: ['perf','conc','saa','risk','viol','liq','esg','drv','gap','profile'],
  1: ['note','intent','prop','rej','item'],
  2: ['news','mkt'],
  3: ['hv'],
};

// Welcher coverage-Schluessel gehoert zu welchem Chip — fuer den Tooltip,
// damit "keine Daten" nicht mit "nicht abgefragt" verwechselt wird.
const SOURCE_COVERAGE = {0:['positions','performance','saa','concentration'],
                         1:['notes','intents','proposals'],
                         2:['market','drivers'], 3:['house_view']};

function markSources(briefing, coverage){
  const ids = new Set();
  briefing.sections.forEach(s=>s.statements.forEach(st=>
    (st.finding_ids||[]).forEach(i=>ids.add(i))));
  (briefing.next_best_actions||[]).forEach(a=>
    (a.finding_ids||[]).forEach(i=>ids.add(i)));

  document.querySelectorAll('.src[data-s]').forEach(chip=>{
    const prefixes = SOURCE_PREFIXES[chip.dataset.s] || [];
    const hit = [...ids].some(id => prefixes.some(p => id.startsWith(p)));
    chip.classList.toggle('done', hit);
    chip.classList.toggle('none', !hit);
    if(hit){
      chip.title = 'Diese Quelle ist im Briefing belegt';
    }else{
      const keys = SOURCE_COVERAGE[chip.dataset.s] || [];
      const states = keys.map(k => (coverage||{})[k]).filter(Boolean);
      const fehler = states.find(s => s !== 'ok' && s !== 'no_data');
      chip.title = fehler
        ? `Quelle nicht erreichbar (${fehler}) — das Briefing kam trotzdem`
        : states.includes('ok')
          ? 'Quelle abgefragt, aber nichts Relevantes für diesen Klienten'
          : 'Für diesen Klienten liegen hier keine Daten vor';
    }
  });
}

function countWords(b){
  const parts = [b.headline];
  b.sections.forEach(s=>s.statements.forEach(st=>parts.push(st.text)));
  (b.likely_questions||[]).forEach(q=>parts.push(q.question, q.answer_hint));
  (b.next_best_actions||[]).forEach(a=>parts.push(a.action, a.rationale));
  return parts.filter(Boolean).join(' ').trim().split(/\s+/).length;
}

function renderBriefing(d){
  const b = d.briefing;
  markSources(b, d.fact_sheet?.coverage);
  const rep = $('#report');
  rep.disabled = false;
  rep.title = 'Gesprächsprotokoll öffnen und drucken';
  const badge = $('#modebadge');
  if(badge){
    badge.className = 'modebadge m-' + (d.mode||'ai');
    badge.textContent = MODE_TEXT[d.mode] || d.mode || '';
  }
  $('#bout').innerHTML = `
    <div class="headline">${esc(b.headline)}</div>
    ${b.sections.map(s=>`
      <div class="sec"><h4>${esc(s.title)}</h4>
        ${s.statements.map(st=>`
          <div class="st t-${st.type}"><span class="dot"></span>
            <span class="tx">${esc(st.text)}
              <span class="src">${st.finding_ids.join(', ')}</span></span></div>`).join('')}
      </div>`).join('')}
    ${b.next_best_actions.length?`<div class="sec"><h4>Next Best Actions</h4>
      ${b.next_best_actions.map(a=>`<div class="st t-recommendation"><span class="dot"></span>
        <span class="tx"><b>${esc(a.action)}</b><br>${esc(a.rationale)}</span></div>`).join('')}</div>`:''}
    ${b.likely_questions.length?`<div class="sec"><h4>Womit der Kunde kommen wird</h4>
      ${b.likely_questions.map(q=>`<div class="st t-fact"><span class="dot"></span>
        <span class="tx">${esc(q.question)}<br><span style="color:#7a7a83">${esc(q.answer_hint)}</span></span></div>`).join('')}</div>`:''}
    <div class="legend">
      <span><i style="background:#9aa0a6"></i>Portfoliofakt</span>
      <span><i style="background:var(--uro-cyan)"></i>Marktkontext</span>
      <span><i style="background:var(--violet)"></i>House View</span>
      <span><i style="background:var(--green)"></i>Empfehlung</span>
      <span><i style="background:var(--uro-red)"></i>Risiko</span>
      <span style="margin-left:auto">${d.generation_seconds}s · <span class="wc ${countWords(b)>220?'over':''}"
        title="Ziel sind 150-220 Wörter für 60 Sekunden Lesezeit">${countWords(b)} Wörter</span> 
        ${d.issues.length?`· <b style="color:var(--uro-red)">${d.issues.length} Aussagen verworfen</b>`
                         :'· <b style="color:var(--green)">Validator sauber</b>'}</span>
    </div>`;
}

// ---- Protokoll nach dem Gespraech ------------------------------------------
// Neues Fenster statt Download: der Berater sieht es sofort und druckt es ueber
// den Browser als PDF. Kein Server-seitiges PDF, keine zusaetzliche Bibliothek.
$('#report').onclick = () => {
  if(!current) return;
  window.open(`/api/clients/${current}/report`, '_blank');
};

// ---- Upload eines unbekannten Klienten -------------------------------------
$('#uploadbtn').onclick = () => $('#uploadinput').click();

$('#uploadinput').onchange = async e => {
  const file = e.target.files[0];
  if(!file) return;
  const btn = $('#uploadbtn');
  const label = btn.textContent;
  btn.textContent = 'Lade …'; btn.disabled = true;

  try{
    const form = new FormData();
    form.append('file', file);
    const res = await fetch('/api/upload', {method:'POST', body:form});
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);

    await boot();
    const ref = (data.refs && data.refs[0]) || (data.added_client_refs||[])[0];
    if(ref) await select(ref);
    btn.textContent = `${data.added} geladen`;
    setTimeout(()=>{ btn.textContent = label; }, 3000);
  }catch(err){
    btn.textContent = label;
    const main = $('#main');
    if(main) main.insertAdjacentHTML('afterbegin',
      `<div class="card"><div class="notice"><b>Upload fehlgeschlagen.</b><br>${esc(err.message)}</div></div>`);
  }finally{
    btn.disabled = false;
    e.target.value = '';
  }
};

boot();
</script>
<script src="/frontend/chat.js"></script>
