[project]
name = "uro-briefing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
